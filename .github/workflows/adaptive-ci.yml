name: ASTRA Adaptive CI

on:
  push:
    branches:
      - feature/astra-adaptive-v1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Repository self-check
        run: python repo_selfcheck.py
      - name: Offline end-to-end preflight
        run: python preflight_all.py
      - name: Adaptive library pure test
        run: python test_adaptive_mode.py
      - name: Adaptive Cost-Smart pure test
        run: python test_adaptive_cost.py
      - name: Adaptive analytics regression
        run: python test_adaptive_auto_v11.py
      - name: Trainer v2 regression
        run: python test_adaptive_trainer_v2.py
      - name: Multi-Market Trainer v3 regression
        run: python test_multi_market_trainer_v3.py
      - name: Execution v4 regression
        run: python test_auto_execution_v4.py
      - name: Execution v4.1 FOK regression
        run: python test_execution_v4_1_fok.py
      - name: FOK + exit shadow labs regression
        run: python test_execution_shadow_labs.py
      - name: Passive DeFi and stop-execution diagnostics regression
        run: python test_diagnostic_audit.py
      - name: Mark-to-market equity fail-closed regression
        run: python test_equity_guard.py
      - name: Worker circuit and MICRO stop protection regression
        run: python test_worker_safety.py
      - name: OKX private HTTP diagnostics regression
        run: python test_okx_http_diagnostics.py
      - name: Strategy Tournament v5 regression
        run: python test_strategy_tournament_v5.py
      - name: Alpha Factory OOS regression
        run: python test_alpha_factory.py
      - name: Mission Control read-only regression
        run: python test_mission_control.py
      - name: Unified model budget regression
        run: python test_model_budget.py
      - name: Shadow Agent Council regression
        run: python test_shadow_agent_council.py
      - name: Demo ledger concurrency regression
        run: python test_demo_ledger_concurrency.py
      - name: Telegram runtime mode test
        run: python test_telegram_mode_control.py
      - name: Shadow lab safety regression
        run: python test_crypto_shadow_lab.py
      - name: Execution quality regression
        run: python test_execution_quality.py
      - name: Final decision regression
        run: python test_final_decision_calibration.py
      - name: Shadow short-horizon strategy regression
        run: python test_scalp_v2.py
      - name: MICRO v1 regression
        run: python test_micro_mode.py
      - name: MICRO v2 profitability regression
        run: python test_micro_v2.py
      - name: MICRO second-position shadow regression
        run: python test_micro_second_shadow.py
      - name: NORMAL Gold + DeFi trading regression
        run: python test_extended_markets.py
      - name: Pure guard/config regressions
        run: |
          python test_no_null_bytes.py
          python test_scalp_mode.py
          python test_treasury_parser.py
      - name: Observability regression
        run: python test_observability.py
      - name: MTF explainability + shadow replay regression
        run: python test_mtf_explainability.py
      - name: Transition regression
        run: python test_transition_mode.py
